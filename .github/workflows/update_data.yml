name: Update LMS Dataset

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run data pipeline
        env:
          MOODLE_BASE_URL: ${{ secrets.MOODLE_BASE_URL }}
          MOODLE_TOKEN: ${{ secrets.MOODLE_TOKEN }}
        run: |
            echo "Starting pipeline..."
            python -u lms_pipeline.py
            echo "Pipeline finished"

      - name: Commit updated dataset
        run: |
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"

            git add data/undp_lms_dataset.csv data/undp_lms_dataset_backup.csv

            git commit -m "Auto-update LMS dataset" || echo "No changes to commit"

            git pull --rebase origin main
            git push origin main