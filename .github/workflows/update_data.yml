name: Update LMS Dataset

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-lms-dataset
  cancel-in-progress: true

jobs:
  update-data:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run data pipeline
        env:
          MOODLE_BASE_URL: ${{ secrets.MOODLE_BASE_URL }}
          MOODLE_TOKEN: ${{ secrets.MOODLE_TOKEN }}
        run: python -u lms_pipeline.py

      - name: Commit updated dataset
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data/undp_lms_dataset.csv data/undp_lms_dataset_backup.csv data/quiz_results.csv

          if git diff --cached --quiet; then
            echo "No dataset changes to commit"
          else
            git commit -m "Auto-update LMS dataset"
            git pull --rebase origin main
            git push origin main
          fi